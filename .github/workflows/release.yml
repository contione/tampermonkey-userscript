name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: git diff --exit-code -- dist
      - name: Validate version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: gh release create "$GITHUB_REF_NAME" dist/tempo.user.js dist/tempo.meta.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
